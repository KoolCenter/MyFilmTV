name: Build MyFilmTV APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Configure persistent signing key
        env:
          KEYSTORE_B64: ${{ secrets.MYFILM_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.MYFILM_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MYFILM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MYFILM_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo 'Set MYFILM_KEYSTORE_B64, MYFILM_STORE_PASSWORD, MYFILM_KEY_ALIAS and MYFILM_KEY_PASSWORD in repository secrets.'
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/myfilm-release.jks"
          echo "MYFILM_KEYSTORE=$RUNNER_TEMP/myfilm-release.jks" >> "$GITHUB_ENV"
          echo "MYFILM_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MYFILM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MYFILM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MyFilmTV.apk
      - name: Upload MyFilmTV.apk
        uses: actions/upload-artifact@v4
        with:
          name: MyFilmTV-apk
          path: MyFilmTV.apk
          if-no-files-found: error
